disallowed-macros = [
    # Threading readiness (PRD/GC_PRD.md §18.6, C9), brought forward by #622.
    # Clippy takes this lint only at a crate root: an `expect` on the
    # invocation or on its module is unfulfilled and the lint still fires. Each
    # crate with one lists its statics in a crate-level `expect`.
    { path = "std::thread_local", reason = "per-thread state, which a second interpreter on the thread shares (#618) and threads will not; list the static in the crate root's `expect` with what it holds (#622)" },
]
