version: '3.8'

services:
  patina-dev:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - cargo-cache:/usr/local/cargo/registry
      - target-cache:/app/target
    working_dir: /app
    stdin_open: true
    tty: true
    command: bash

  patina-test:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
    working_dir: /app
    command: cargo test --verbose

volumes:
  cargo-cache:
  target-cache:
