name: GC zeal

# The zeal lane (#625; docs/GC_DESIGN.md §11, docs/TEST_ORGANIZATION.md "GC
# lanes"): PATINA_GC_ZEAL=entry collects at every outermost safe point,
# allocation or not, so every pc a collection can run at has its register
# liveness map checked, in a build that fills each register a map calls dead
# with DEAD_SLOT and panics where one is read. Stress cannot do this: it
# collects only after allocations, and most pcs follow none.
#
# Zeal costs about 7x stress 1, so it runs a subset (tests/scheme/control/
# without tail-recursion.scm, both backends, about 9 minutes on a runner),
# and only for the changes that can break what it checks: the VM's runtime
# and compiler, which make and use the maps; the heap and its collector; the
# tree-walker's trampoline, which polls the same way; and the lane's own
# inputs. A path filter rather than a schedule, so the run comes with the
# change that broke it. The filter has the limits ci.yml's has
# (docs/TEST_ORGANIZATION.md, "CI trigger scope"): a whole workflow filtered
# out leaves a required check pending, and none is required today.
on:
  push:
    branches: [ main ]
    paths:
      - 'crates/patina-vm/src/runtime/**'
      - 'crates/patina-vm/src/compiler/**'
      - 'crates/patina-core/src/heap/**'
      - 'crates/patina-tree-walker/src/eval/cps_eval/**'
      - 'crates/patina-tests/tests/scheme/control/**'
      - 'crates/patina-tests/tests/finished_forms_release_code.rs'
      - 'scripts/run_gc_zeal.sh'
      - '.github/workflows/gc-zeal.yml'
  pull_request:
    branches: [ main, 'codex/429-*' ]
    paths:
      - 'crates/patina-vm/src/runtime/**'
      - 'crates/patina-vm/src/compiler/**'
      - 'crates/patina-core/src/heap/**'
      - 'crates/patina-tree-walker/src/eval/cps_eval/**'
      - 'crates/patina-tests/tests/scheme/control/**'
      - 'crates/patina-tests/tests/finished_forms_release_code.rs'
      - 'scripts/run_gc_zeal.sh'
      - '.github/workflows/gc-zeal.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  zeal:
    name: GC zeal (control suite, both backends)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      run: rustup show
    - uses: Swatinem/rust-cache@v2
    - name: Build release with the stale-reference checks
      run: cargo build --release -p patina-repl --bin patina --features patina-core/gc-check
    # Without the checks a register a wrong map retired reads as a legal
    # UNSPECIFIED, and the lane can only see it if the output changes.
    - name: Require the checks in the binary
      run: |
        version=$(./target/release/patina --version)
        echo "$version"
        case "$version" in
          *"(gc-check)") ;;
          *) echo "::error::target/release/patina was built without the stale-reference checks"; exit 1 ;;
        esac
    # Each file must be byte-identical to GC-off, exit 0, print its SRFI 64
    # summary, and have collected; the script fails the step otherwise.
    - name: Zeal lane vs GC-off, both backends
      run: ./scripts/run_gc_zeal.sh target/release/patina
    # Under zeal the pending flag is raised again before a collection
    # returns, so the VM has to be told a collection ran to let go of the code
    # it freed (#338); these tests fail if it is not.
    - name: Code release under zeal
      run: PATINA_GC_ZEAL=entry cargo test --release -p patina-tests --features gc-check --test finished_forms_release_code
