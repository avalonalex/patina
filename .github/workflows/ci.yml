name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    - name: Run tests
      env:
        # A handful of differential tests compare output against a locally
        # installed chibi-scheme binary, which the runners don't have. The
        # R7RS compliance gate is the separate `chibi` job (vendored suite,
        # no external binary needed).
        SKIP_CHIBI_TESTS: 1
      run: cargo test --all --lib --tests

  chibi:
    name: R7RS Compliance (chibi suite)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - name: Build release
      run: cargo build --release
    # The script requires every test to pass AND pins the grand total
    # (EXPECTED_TOTAL, the single statement of the expected count): a filtered
    # or truncated run fails even with zero failures. Both backend lanes share
    # the release build above.
    - name: Run chibi r7rs-tests, VM backend
      run: ./scripts/run_chibi_tests.sh
    - name: Run chibi r7rs-tests, tree-walker backend
      run: ./scripts/run_chibi_tests_tree_walker.sh

  # The two GC lanes (docs/GC_DESIGN.md §10 stage 4b): the chibi suite must
  # be byte-identical with GC off, under stress, and under the adaptive mode,
  # on both backends. The debug lane is the strong one — poison assertions
  # turn a lost root into a deterministic panic at the exact accessor.
  gc-differential:
    name: GC differential (release)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - name: Build release
      run: cargo build --release
    - name: Stress + adaptive lanes vs baseline, both backends
      run: ./scripts/run_gc_differential.sh target/release/patina

  gc-differential-debug:
    name: GC differential (debug, poison assertions)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - name: Build debug
      run: cargo build
    - name: Stress + adaptive lanes vs baseline, both backends
      run: ./scripts/run_gc_differential.sh target/debug/patina

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
    - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - uses: Swatinem/rust-cache@v2
    - run: cargo clippy --all-targets --all-features -- -D warnings
