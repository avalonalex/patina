name: CI

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'PRD/**' ]
  pull_request:
    branches: [ main, 'codex/429-*' ]
    paths-ignore: [ 'PRD/**' ]

# Skip only changes confined to PRD/. Any path outside it still runs every
# job below. See docs/TEST_ORGANIZATION.md, "CI trigger scope", before making
# these checks required or broadening the filter.

env:
  CARGO_TERM_COLOR: always

# Every job compiles with the version in rust-toolchain.toml — rustup honors
# that file for each cargo invocation, so CI and local development cannot
# drift apart. `rustup show` materializes it; there is deliberately no
# toolchain version anywhere in this file, because a second copy is a second
# thing to forget when bumping.

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      run: rustup show

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    - name: Run tests
      env:
        # A handful of differential tests compare output against a locally
        # installed chibi-scheme binary, which the runners don't have. The
        # R7RS compliance gate is the separate `chibi` job (vendored suite,
        # no external binary needed).
        SKIP_CHIBI_TESTS: 1
      run: cargo test --all --lib --tests

    # The per-PR GC stress lane (#626; docs/TEST_ORGANIZATION.md, "GC
    # lanes"): thirteen targets that drive the collector, control flow and
    # library loading through the embedding API, which the chibi lanes never
    # reach, under PATINA_GC_STRESS=16, and scheme_suite.rs at 4096, in this
    # debug build, whose stale-reference checks turn a lost root into a
    # panic. Each target must pass and report at least its pinned number of
    # collections. It reuses the build above: the script names the workspace
    # as that command does, so nothing recompiles. It took about a minute
    # locally (2026-10-02); the limit, near ten times that, stops a target
    # that a collector regression makes crawl, and the targets that finished
    # are in the log above the one that did not.
    - name: GC stress lane (debug, collector and control-flow targets)
      timeout-minutes: 15
      run: ./scripts/run_gc_stress_tests.sh

    - name: Embedding examples and feature combinations
      run: |
        cargo test -p patina-interpreter -p patina-pipeline --doc
        cargo run -p patina-interpreter --example embed_vm --no-default-features --features vm
        cargo run -p patina-interpreter --example embed_tree_walker --no-default-features --features tree-walker
        ./scripts/check_embedding_features.sh

    - name: Script integrity and failure-path tests (offline)
      run: python3 -B -m unittest discover -s scripts/tests -p 'test_*.py'

  chibi:
    name: R7RS Compliance (chibi suite)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      run: rustup show
    - uses: Swatinem/rust-cache@v2
    - name: Build release
      run: cargo build --release
    # The script requires every test to pass AND pins the grand total
    # (EXPECTED_TOTAL, the single statement of the expected count): a filtered
    # or truncated run fails even with zero failures. Both backend lanes share
    # the release build above.
    - name: Run chibi r7rs-tests, VM backend
      run: ./scripts/run_chibi_tests.sh
    - name: Run chibi r7rs-tests, tree-walker backend
      run: ./scripts/run_chibi_tests_tree_walker.sh
    # Discover the smoke manifest on every run so new drivers join the gate.
    # Unlike corpus measurement, check-smoke exits nonzero for any failure.
    - name: Check corpus smoke drivers, VM backend
      run: >-
        ./target/release/patina-compat check-smoke
        --results "$RUNNER_TEMP/compat-smoke-vm.scm"
        --report "$RUNNER_TEMP/compat-smoke-vm.txt"
    - name: Check corpus smoke drivers, tree-walker backend
      if: ${{ !cancelled() }}
      run: >-
        ./target/release/patina-compat check-smoke --tree-walker
        --results "$RUNNER_TEMP/compat-smoke-tree-walker.scm"
        --report "$RUNNER_TEMP/compat-smoke-tree-walker.txt"

  # The two GC lanes (docs/GC_DESIGN.md §10 stage 4b): the chibi suite must
  # be byte-identical with GC off, under stress, and under the adaptive mode,
  # on both backends. Both run the stale-reference checks (#621), which turn
  # a lost root into a deterministic panic at the first use of the stale
  # value, or at the next collection that reaches it: every debug build has
  # them, and the release lane compiles them in with patina-core's gc-check
  # feature, which makes stress 1 affordable there. The same builds fill a
  # register a liveness map calls dead with DEAD_SLOT and panic where one is
  # read (#625). The third GC lane, zeal, is gc-zeal.yml: it collects at
  # every safe point, so it runs on a subset, and only for the changes that
  # can break it.
  gc-differential:
    name: GC differential (release)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      run: rustup show
    - uses: Swatinem/rust-cache@v2
    # Only this lane builds with the checks; every other job keeps the plain
    # release build, which compiles none of them.
    - name: Build release with the stale-reference checks
      run: cargo build --release -p patina-repl --bin patina --features patina-core/gc-check
    # Without the checks this lane can only see a premature collection that
    # changes the output, so a binary built without them must fail the job,
    # not pass it. A build with them says so in its version line.
    - name: Require the checks in the binary
      run: |
        version=$(./target/release/patina --version)
        echo "$version"
        case "$version" in
          *"(gc-check)") ;;
          *) echo "::error::target/release/patina was built without the stale-reference checks"; exit 1 ;;
        esac
    # The positive controls, built with the same features: each must panic
    # with its check's message. A build without the checks reports them
    # ignored; --include-ignored runs them anyway, so there they fail, and
    # the summary must show controls that ran and none ignored. One test
    # target per call, since the summary check reads one result line: the
    # stale-reference checks (#621); the GC protocol checks (#624) —
    # the defer depth at collection, a holder's extent, the defer balance and
    # a poll inside an AssertNoGc window, the last on each backend; and the
    # retired-register checks (#625), a DEAD_SLOT read by an instruction or a
    # call's argument copy under a deliberately wrong liveness map, and one
    # stored in the heap (the latter among the patina-core heap::check:: ones).
    #
    # The defer balance is the one check every build carries, so its control
    # also runs in the plain release build, without gc-check and without
    # --include-ignored: there an underflow would wrap the depth and stop
    # collection with no report, and every other run of the control has
    # GC_CHECK on, so a balance check gated on it would pass them all.
    - name: Positive controls for the checks
      run: |
        set -euo pipefail
        controls() {
          "$@" 2>&1 | tee "$RUNNER_TEMP/controls.txt"
          grep -Eq '^test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored' "$RUNNER_TEMP/controls.txt"
        }
        controls cargo test --release -p patina-core --features gc-check --lib -- --include-ignored heap::check:: heap::gc::tests::marking_a_free heap::gc::tests::protocol::
        controls cargo test --release -p patina-tests --features gc-check --test stale_references -- --include-ignored
        controls cargo test --release -p patina-tests --features gc-check --test gc_protocol -- --include-ignored
        controls cargo test --release -p patina-tests --features gc-check --test retired_registers -- --include-ignored
        controls cargo test --release -p patina-core --lib -- --exact heap::gc::tests::protocol::an_unbalanced_defer_exit_panics
    - name: Stress 1 + adaptive lanes vs baseline, both backends
      run: PATINA_GC_STRESS_INTERVAL=1 ./scripts/run_gc_differential.sh target/release/patina

  gc-differential-debug:
    name: GC differential (debug, poison assertions)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      run: rustup show
    - uses: Swatinem/rust-cache@v2
    - name: Build debug
      run: cargo build
    - name: Stress + adaptive lanes vs baseline, both backends
      run: ./scripts/run_gc_differential.sh target/debug/patina

  # The oracle lane (#193 Phase 3): every tests/scheme/*.scm file under chibi
  # and Gauche, held to the divergence register. It needs no Rust — it runs
  # other implementations over our files — and it pins their versions,
  # because the register records what *those* versions answer: a floating
  # oracle would fail unrelated PRs the day it released a fix. Both are built
  # from checksummed release sources and cached, so the build is paid once
  # per version. Bumping a version is a deliberate change that re-measures
  # the register, like bumping rust-toolchain.toml.
  suite-oracles:
    name: Suite oracles (chibi 0.12, Gauche 0.9.15)
    runs-on: ubuntu-latest
    env:
      CHIBI_VERSION: "0.12"
      CHIBI_SHA256: b70a1147bc70a0f90df3fb6081bc99808237fd17a9accf9ee7a2cc20d95a4df0
      GAUCHE_VERSION: "0.9.15"
      GAUCHE_SHA256: 3643e27bc7c8822cfd6fb2892db185f658e8e364938bc2ccfcedb239e35af783
      ORACLES: /home/runner/oracles
    steps:
    - uses: actions/checkout@v4

    - name: Cache the oracles
      id: oracle-cache
      uses: actions/cache@v4
      with:
        path: /home/runner/oracles
        # The trailing number is the recipe's: bump it when the build steps
        # below change, so a stale build is not restored under a new recipe.
        key: oracles-${{ runner.os }}-chibi-${{ env.CHIBI_VERSION }}-gauche-${{ env.GAUCHE_VERSION }}-1

    - name: Build chibi-scheme
      if: steps.oracle-cache.outputs.cache-hit != 'true'
      run: |
        curl -sSL -o chibi.tgz "https://github.com/ashinn/chibi-scheme/archive/refs/tags/${CHIBI_VERSION}.tar.gz"
        echo "${CHIBI_SHA256}  chibi.tgz" | sha256sum -c
        tar xzf chibi.tgz
        cd "chibi-scheme-${CHIBI_VERSION}"
        make -j"$(nproc)" PREFIX="$ORACLES"
        make install PREFIX="$ORACLES"

    - name: Build Gauche
      if: steps.oracle-cache.outputs.cache-hit != 'true'
      run: |
        curl -sSL -o gauche.tgz "https://github.com/shirok/Gauche/releases/download/release${GAUCHE_VERSION//./_}/Gauche-${GAUCHE_VERSION}.tgz"
        echo "${GAUCHE_SHA256}  gauche.tgz" | sha256sum -c
        tar xzf gauche.tgz
        cd "Gauche-${GAUCHE_VERSION}"
        # No TLS: the suite never touches the network, and it drops the
        # mbedtls dependency the Homebrew build carries.
        ./configure --prefix="$ORACLES" --with-tls=no
        make -j"$(nproc)"
        make install

    - name: Run the oracle lane
      run: |
        export PATH="$ORACLES/bin:$PATH"
        export LD_LIBRARY_PATH="$ORACLES/lib:${LD_LIBRARY_PATH:-}"
        # A backstop under the script's own heap ceilings for chibi and
        # Gauche: no oracle process may take the runner down, whatever file
        # it is stuck on. An oracle that hits it fails its file, which the
        # lane reports.
        ulimit -v 6291456
        chibi-scheme -V
        gosh -V | head -1
        SUITE_ORACLES_REQUIRE_ALL=1 ./scripts/run_suite_oracles.sh

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      run: rustup show
    - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    # The collector's trace code names every field of what it traces (#623):
    # no `..` and no catch-all arm in the trace functions, a reason beside
    # every `field: _` and `_` payload, and no root provider left unread.
    # Needs no build, so it runs first.
    - name: Trace code names every field
      run: python3 -B scripts/check_gc_trace_names.py
    - name: Install Rust
      run: rustup show
    - uses: Swatinem/rust-cache@v2
    - run: cargo clippy --all-targets --all-features -- -D warnings
    # The configuration that ships: release, without `gc-check`. The step
    # above lints with debug assertions and every feature on, which compiles
    # the stale-reference checks in (`patina-core/src/heap/check.rs`) and
    # leaves their empty stand-ins unlinted.
    - name: Clippy, plain release
      run: cargo clippy --release --all-targets -- -D warnings
