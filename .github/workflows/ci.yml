name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

# Every job compiles with the version in rust-toolchain.toml — rustup honors
# that file for each cargo invocation, so CI and local development cannot
# drift apart. `rustup show` materializes it; there is deliberately no
# toolchain version anywhere in this file, because a second copy is a second
# thing to forget when bumping.

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      run: rustup show

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    - name: Run tests
      env:
        # A handful of differential tests compare output against a locally
        # installed chibi-scheme binary, which the runners don't have. The
        # R7RS compliance gate is the separate `chibi` job (vendored suite,
        # no external binary needed).
        SKIP_CHIBI_TESTS: 1
      run: cargo test --all --lib --tests

  chibi:
    name: R7RS Compliance (chibi suite)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      run: rustup show
    - uses: Swatinem/rust-cache@v2
    - name: Build release
      run: cargo build --release
    # The script requires every test to pass AND pins the grand total
    # (EXPECTED_TOTAL, the single statement of the expected count): a filtered
    # or truncated run fails even with zero failures. Both backend lanes share
    # the release build above.
    - name: Run chibi r7rs-tests, VM backend
      run: ./scripts/run_chibi_tests.sh
    - name: Run chibi r7rs-tests, tree-walker backend
      run: ./scripts/run_chibi_tests_tree_walker.sh

  # The two GC lanes (docs/GC_DESIGN.md §10 stage 4b): the chibi suite must
  # be byte-identical with GC off, under stress, and under the adaptive mode,
  # on both backends. The debug lane is the strong one — poison assertions
  # turn a lost root into a deterministic panic at the exact accessor.
  gc-differential:
    name: GC differential (release)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      run: rustup show
    - uses: Swatinem/rust-cache@v2
    - name: Build release
      run: cargo build --release
    - name: Stress + adaptive lanes vs baseline, both backends
      run: ./scripts/run_gc_differential.sh target/release/patina

  gc-differential-debug:
    name: GC differential (debug, poison assertions)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      run: rustup show
    - uses: Swatinem/rust-cache@v2
    - name: Build debug
      run: cargo build
    - name: Stress + adaptive lanes vs baseline, both backends
      run: ./scripts/run_gc_differential.sh target/debug/patina

  # The oracle lane (#193 Phase 3): every tests/scheme/*.scm file under chibi
  # and Gauche, held to the divergence register. It needs no Rust — it runs
  # other implementations over our files — and it pins their versions,
  # because the register records what *those* versions answer: a floating
  # oracle would fail unrelated PRs the day it released a fix. Both are built
  # from checksummed release sources and cached, so the build is paid once
  # per version. Bumping a version is a deliberate change that re-measures
  # the register, like bumping rust-toolchain.toml.
  suite-oracles:
    name: Suite oracles (chibi 0.12, Gauche 0.9.15)
    runs-on: ubuntu-latest
    env:
      CHIBI_VERSION: "0.12"
      CHIBI_SHA256: b70a1147bc70a0f90df3fb6081bc99808237fd17a9accf9ee7a2cc20d95a4df0
      GAUCHE_VERSION: "0.9.15"
      GAUCHE_SHA256: 3643e27bc7c8822cfd6fb2892db185f658e8e364938bc2ccfcedb239e35af783
      ORACLES: /home/runner/oracles
    steps:
    - uses: actions/checkout@v4

    - name: Cache the oracles
      id: oracle-cache
      uses: actions/cache@v4
      with:
        path: /home/runner/oracles
        # The trailing number is the recipe's: bump it when the build steps
        # below change, so a stale build is not restored under a new recipe.
        key: oracles-${{ runner.os }}-chibi-${{ env.CHIBI_VERSION }}-gauche-${{ env.GAUCHE_VERSION }}-1

    - name: Build chibi-scheme
      if: steps.oracle-cache.outputs.cache-hit != 'true'
      run: |
        curl -sSL -o chibi.tgz "https://github.com/ashinn/chibi-scheme/archive/refs/tags/${CHIBI_VERSION}.tar.gz"
        echo "${CHIBI_SHA256}  chibi.tgz" | sha256sum -c
        tar xzf chibi.tgz
        cd "chibi-scheme-${CHIBI_VERSION}"
        make -j"$(nproc)" PREFIX="$ORACLES"
        make install PREFIX="$ORACLES"

    - name: Build Gauche
      if: steps.oracle-cache.outputs.cache-hit != 'true'
      run: |
        curl -sSL -o gauche.tgz "https://github.com/shirok/Gauche/releases/download/release${GAUCHE_VERSION//./_}/Gauche-${GAUCHE_VERSION}.tgz"
        echo "${GAUCHE_SHA256}  gauche.tgz" | sha256sum -c
        tar xzf gauche.tgz
        cd "Gauche-${GAUCHE_VERSION}"
        # No TLS: the suite never touches the network, and it drops the
        # mbedtls dependency the Homebrew build carries.
        ./configure --prefix="$ORACLES" --with-tls=no
        make -j"$(nproc)"
        make install

    - name: Run the oracle lane
      run: |
        export PATH="$ORACLES/bin:$PATH"
        export LD_LIBRARY_PATH="$ORACLES/lib:${LD_LIBRARY_PATH:-}"
        chibi-scheme -V
        gosh -V | head -1
        SUITE_ORACLES_REQUIRE_ALL=1 ./scripts/run_suite_oracles.sh

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      run: rustup show
    - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      run: rustup show
    - uses: Swatinem/rust-cache@v2
    - run: cargo clippy --all-targets --all-features -- -D warnings
