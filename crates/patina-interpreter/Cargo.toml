[package]
name = "patina-interpreter"
version = "0.1.0"
edition = "2024"
description = "High-level interpreter interface for Patina Scheme - supports multiple backends"

[dependencies]
# Core types
patina-core = { path = "../patina-core" }
patina-runtime = { path = "../patina-runtime" }
patina-frontend = { path = "../patina-frontend" }
patina-ir = { path = "../patina-ir" }

# Pipeline orchestration
patina-pipeline = { path = "../patina-pipeline" }

# Default backend
patina-tree-walker = { path = "../patina-tree-walker" }

# Error handling
thiserror = { workspace = true }

[lib]
name = "patina_interpreter"
path = "src/lib.rs"
