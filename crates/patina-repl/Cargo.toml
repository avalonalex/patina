[package]
name = "patina-repl"
version = "0.1.0"
edition = "2024"
description = "REPL and CLI for Patina Scheme"

[dependencies]
# Workspace crates
patina-core = { path = "../patina-core" }
patina-runtime = { path = "../patina-runtime" }
patina-frontend = { path = "../patina-frontend" }
patina-tree-walker = { path = "../patina-tree-walker" }
patina-interpreter = { path = "../patina-interpreter" }
patina-vm = { path = "../patina-vm" }

# Rich REPL experience
rustyline = { version = "17.0.2", features = ["derive"] }
nu-ansi-term = "0.50"  # For syntax highlighting
dirs = "6.0.0"  # For finding home directory to save history

# Error handling
thiserror = { workspace = true }

[[bin]]
name = "patina"
path = "src/main.rs"
