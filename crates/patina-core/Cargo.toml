[package]
name = "patina-core"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
description = "Core types for Patina Scheme interpreter"

[dependencies]
# Numeric tower support (from workspace)
num-bigint.workspace = true
num-rational.workspace = true
num-traits.workspace = true
num-complex.workspace = true

# Fast non-cryptographic hashing for the Environment binding maps
rustc-hash.workspace = true

# Small vector optimization for ScopeSet
smallvec.workspace = true

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }

[features]
# Compile the stale-reference checks (#621, `heap::GC_CHECK`) into a release
# build. Every debug build has them already; this feature exists for the
# release GC lane, which needs the checks in optimized code. Additive: the
# shipped binary does not enable it and compiles none of the checks.
gc-check = []

# Compile `heap::gc::collect_for_tests`, which collects outside every safe
# point, for unit tests in other crates that drive the collector against
# hand-built state (#624), and `heap::sentinels`, which those tests use to
# check that every traced field kept its value (#623). Only the
# [dev-dependencies] of patina-vm, patina-tree-walker and patina-runtime
# enable it, and resolver 2 keeps a dev-dependency's features out of normal
# builds, so no build that ships can name a collector entry point.
test-support = []
