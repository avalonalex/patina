[package]
name = "patina-tests"
version = "0.1.0"
edition = "2024"
description = "Integration and compliance tests for Patina Scheme"
publish = false

[dependencies]
# Interpreter API for integration testing
patina-interpreter = { path = "../patina-interpreter" }

# For accessing internal types in tests
patina-core = { path = "../patina-core" }
patina-runtime = { path = "../patina-runtime" }
patina-frontend = { path = "../patina-frontend" }
patina-tree-walker = { path = "../patina-tree-walker" }
patina-vm = { path = "../patina-vm" }
patina-primitives = { path = "../patina-primitives" }

[dev-dependencies]
assert_matches = "1.5"
tempfile = "3"
criterion = { workspace = true }
patina-ir = { path = "../patina-ir" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The wrong-map switch the DEAD_SLOT controls drive (tests/retired_registers.rs,
# #625). A dev-dependency, so the feature is never in a build that ships.
patina-vm = { path = "../patina-vm", features = ["test-support"] }

[features]
# Run the check-build controls (tests/stale_references.rs, gc_protocol.rs and
# retired_registers.rs) in a release build: compiles patina-core's checks in
# (#621, #624, #625). Debug builds have them without it.
gc-check = ["patina-core/gc-check"]

[[bench]]
name = "scheme_benchmarks"
harness = false

# Note: This is a test-only crate, no lib or bin targets
