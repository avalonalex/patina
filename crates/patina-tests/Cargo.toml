[package]
name = "patina-tests"
version = "0.1.0"
edition = "2024"
description = "Integration and compliance tests for Patina Scheme"
publish = false

[dependencies]
# Interpreter API for integration testing
patina-interpreter = { path = "../patina-interpreter" }

# For accessing internal types in tests
patina-runtime = { path = "../patina-runtime" }
patina-frontend = { path = "../patina-frontend" }
patina-tree-walker = { path = "../patina-tree-walker" }

[dev-dependencies]
assert_matches = "1.5"
tempfile = "3"

# Note: This is a test-only crate, no lib or bin targets
