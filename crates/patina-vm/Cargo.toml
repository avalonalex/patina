[package]
name = "patina-vm"
version = "0.1.0"
edition = "2024"
description = "Register-based bytecode VM backend for Patina Scheme"

[dependencies]
patina-core = { path = "../patina-core" }
patina-runtime = { path = "../patina-runtime" }
patina-frontend = { path = "../patina-frontend" }
patina-ir = { path = "../patina-ir" }
patina-primitives = { path = "../patina-primitives" }

thiserror = { workspace = true }
tracing = { workspace = true }
rustc-hash = { workspace = true }

[dev-dependencies]
patina-interpreter = { path = "../patina-interpreter" }
# The weak continuation table tests drive the collector directly, through
# patina-core's test-only entry (`collect_for_tests`, #624).
patina-core = { path = "../patina-core", features = ["test-support"] }

[features]
# Compile `test_support`, the wrong-map switch the `DEAD_SLOT` controls drive
# (#625, crates/patina-tests/tests/retired_registers.rs). Only patina-tests'
# [dev-dependencies] enable it, and resolver 2 keeps a dev-dependency's
# features out of normal builds, so no build that ships has the switch.
test-support = []

[lib]
name = "patina_vm"
path = "src/lib.rs"
