[package]
name = "patina-vm"
version = "0.1.0"
edition = "2024"
description = "Register-based bytecode VM backend for Patina Scheme"

[dependencies]
patina-core = { path = "../patina-core" }
patina-runtime = { path = "../patina-runtime" }
patina-frontend = { path = "../patina-frontend" }
patina-ir = { path = "../patina-ir" }
patina-primitives = { path = "../patina-primitives" }

thiserror = { workspace = true }
tracing = { workspace = true }
rustc-hash = { workspace = true }

[dev-dependencies]
patina-interpreter = { path = "../patina-interpreter" }
# The weak continuation table tests drive the collector directly, through
# patina-core's test-only entry (`collect_for_tests`, #624).
patina-core = { path = "../patina-core", features = ["test-support"] }

[features]
# Compile `test_support`, the switches the check builds' positive controls
# drive: the wrong-map switch of the `DEAD_SLOT` controls (#625,
# crates/patina-tests/tests/retired_registers.rs), the switch that skips
# the units' link tables, which `release_dead_code`'s check refuses, and the
# one that skips their entries, whose placeholders the sweep then frees (#836,
# crates/patina-tests/tests/gc_vm.rs), and the one that polls at the end of
# each load window (#836, crates/patina-tests/tests/gc_protocol.rs). Only
# patina-tests' [dev-dependencies] enable it, and resolver 2 keeps a
# dev-dependency's features out of normal builds, so no build that ships has
# the switches.
test-support = []

[lib]
name = "patina_vm"
path = "src/lib.rs"
