[package]
name = "patina-tree-walker"
version = "0.1.0"
edition = "2024"
description = "Tree-walking interpreter backend for Patina Scheme"

[dependencies]
# Workspace crates
patina-runtime = { path = "../patina-runtime" }
patina-frontend = { path = "../patina-frontend" }
patina-macros = { path = "../patina-macros" }
patina-ir = { path = "../patina-ir" }

# Numeric dependencies (needed by primitives)
num-bigint = { workspace = true }
num-rational = { workspace = true }
num-traits = { workspace = true }
num-complex = { workspace = true }

# Error handling
thiserror = { workspace = true }

# For gensym (thread-safe counter)
once_cell = { workspace = true }

# Unicode case folding
unicode-casefold = "0.2"

[lib]
name = "patina_tree_walker"
path = "src/lib.rs"
