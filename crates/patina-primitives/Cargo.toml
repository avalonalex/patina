[package]
name = "patina-primitives"
version = "0.1.0"
edition = "2024"
description = "Shared primitive procedure implementations for Patina Scheme"

[dependencies]
patina-runtime = { path = "../patina-runtime" }
patina-frontend = { path = "../patina-frontend" }
patina-core = { path = "../patina-core" }
patina-ir = { path = "../patina-ir" }

num-bigint = { workspace = true }
num-rational = { workspace = true }
num-traits = { workspace = true }
num-complex = { workspace = true }

thiserror = { workspace = true }
unicode-casefold = "0.2"
tracing = { workspace = true }

[lib]
name = "patina_primitives"
path = "src/lib.rs"
