[package]
name = "patina-frontend"
version = "0.1.0"
edition = "2024"
description = "Frontend for Patina Scheme: Lexer + Parser + Macro Expander"

[dependencies]
# Workspace crates
patina-core = { path = "../patina-core" }
patina-runtime = { path = "../patina-runtime" }
patina-ir = { path = "../patina-ir" }
patina-macros = { path = "../patina-macros" }

# Numeric dependencies (needed by parser)
num-bigint = { workspace = true }
num-rational = { workspace = true }
num-traits = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Per-form tables on the desugarer's reference path
rustc-hash = { workspace = true }

[lib]
name = "patina_frontend"
path = "src/lib.rs"
