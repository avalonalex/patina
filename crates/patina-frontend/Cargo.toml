[package]
name = "patina-frontend"
version = "0.1.0"
edition = "2024"
description = "Frontend for Patina Scheme: Lexer + Parser + Macro Expander"

[dependencies]
# Workspace crates
patina-runtime = { path = "../patina-runtime" }

# Numeric dependencies (needed by parser)
num-bigint = { workspace = true }
num-rational = { workspace = true }
num-traits = { workspace = true }

# Error handling
thiserror = { workspace = true }

# For gensym (thread-safe counter)
once_cell = { workspace = true }

[lib]
name = "patina_frontend"
path = "src/lib.rs"
