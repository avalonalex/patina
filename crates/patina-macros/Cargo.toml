[package]
name = "patina-macros"
version = "0.1.0"
edition = "2024"
description = "Macro expansion system for Patina Scheme: syntax-rules and hygiene"

[dependencies]
# Workspace crates
patina-runtime = { path = "../patina-runtime" }
patina-core = { path = "../patina-core" }

# Error handling
thiserror = { workspace = true }

[dev-dependencies]
# For testing only - allows parsing syntax-rules definitions in tests
patina-frontend = { path = "../patina-frontend" }

[lib]
name = "patina_macros"
path = "src/lib.rs"
