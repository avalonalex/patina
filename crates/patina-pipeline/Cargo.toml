[package]
name = "patina-pipeline"
version = "0.1.0"
edition = "2024"
description = "Legacy tree-walker embedding facade for Patina Scheme"

[dependencies]
# Compatibility facade: evaluation lives in Interpreter<B>, never here.
patina-interpreter = { path = "../patina-interpreter", default-features = false, features = ["legacy-pipeline"] }

[lib]
name = "patina_pipeline"
path = "src/lib.rs"
