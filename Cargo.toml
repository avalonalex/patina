# Workspace configuration
[workspace]
members = [
    "crates/patina-core",
    "crates/patina-runtime",
    "crates/patina-ir",
    "crates/patina-frontend",
    "crates/patina-macros",
    "crates/patina-pipeline",
    "crates/patina-primitives",
    "crates/patina-vm",
    "crates/patina-tree-walker",
    "crates/patina-interpreter",
    "crates/patina-repl",
    "crates/patina-tests",
    "crates/patina-compat",
]
resolver = "2"

[workspace.package]
license = "MIT"
repository = "https://github.com/avalonalex/patina"

# Shared dependencies across workspace
#
# Versions are stated at the granularity of a *breaking* change, and nothing
# finer. Cargo requirements are already caret ranges — "2.0.18" and "2" have
# the identical upper bound of <3.0.0, and the extra digits only assert a
# minimum nobody here depends on — so spelling out patch levels does not
# constrain anything; it just invites pointless edits. For 0.x crates the
# minor field is the breaking unit, so "0.4" means <0.5.0.
#
# The effect: `cargo update` handles every compatible upgrade on its own and
# records it in Cargo.lock, and a manifest edit is required exactly when a
# dependency makes a breaking release. Cargo.lock is committed, so the exact
# versions in use are always pinned regardless of how loose these ranges are.
[workspace.dependencies]
# Numeric tower support for R7RS compliance.
#
# num-bigint is held at 0.4 by num-rational, which has no 0.5 release: our
# BigRational is Ratio<BigInt>, so taking num-bigint 0.5 alone puts two
# incompatible BigInt types in the graph (verified — 36 type errors of the
# form "expected BigInt, found num_bigint::bigint::BigInt"). Move all four
# together once num-rational 0.5 exists.
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
num-complex = "0.4"

# Error handling
thiserror = "2"

# Small vector optimization
smallvec = "1"

# Fast non-cryptographic hashing for hot-path string-keyed maps
rustc-hash = "2"

# Logging/tracing
tracing = "0.1"

# Benchmarking
criterion = { version = "0.8", features = ["html_reports"] }

# Tests interpret real Scheme (every integration test boots a full interpreter
# and loads (scheme base)), which is unusably slow at opt-level 0. Measured
# 2026-08-12 on the full patina-tests package, run time with binaries prebuilt:
# opt-level 0 → 32.6s, opt-level 1 → 7.5s (~4.3x). Adding [profile.dev]
# opt-level = 1 gained nothing further (7.2s) and would slow every debug
# `cargo build`, so only the test profile is raised. The dev- and test-profile
# artifacts coexist under target/debug (verified: alternating `cargo build` /
# `cargo test` rebuilds nothing), so the split costs disk, not recompiles.
[profile.test]
opt-level = 1

# No main package anymore - workspace only
