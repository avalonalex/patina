# Workspace configuration
[workspace]
members = [
    "crates/patina-core",
    "crates/patina-runtime",
    "crates/patina-ir",
    "crates/patina-frontend",
    "crates/patina-macros",
    "crates/patina-pipeline",
    "crates/patina-primitives",
    "crates/patina-vm",
    "crates/patina-tree-walker",
    "crates/patina-interpreter",
    "crates/patina-repl",
    "crates/patina-tests",
]
resolver = "2"

[workspace.package]
license = "MIT"
repository = "https://github.com/avalonalex/patina"

# Shared dependencies across workspace
[workspace.dependencies]
# Numeric tower support for R7RS compliance
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
num-complex = "0.4"

# Error handling
thiserror = "2.0.18"

# Thread-safe lazy statics
once_cell = "1.19"

# Small vector optimization
smallvec = "1.13"

# Fast non-cryptographic hashing for hot-path string-keyed maps
rustc-hash = "2"

# Logging/tracing
tracing = "0.1.44"

# Benchmarking
criterion = { version = "0.8.2", features = ["html_reports"] }

# Tests interpret real Scheme (every integration test boots a full interpreter
# and loads (scheme base)), which is unusably slow at opt-level 0. Measured
# 2026-08-12 on the full patina-tests package, run time with binaries prebuilt:
# opt-level 0 → 32.6s, opt-level 1 → 7.5s (~4.3x). Adding [profile.dev]
# opt-level = 1 gained nothing further (7.2s) and would slow every debug
# `cargo build`, so only the test profile is raised. The dev- and test-profile
# artifacts coexist under target/debug (verified: alternating `cargo build` /
# `cargo test` rebuilds nothing), so the split costs disk, not recompiles.
[profile.test]
opt-level = 1

# No main package anymore - workspace only
