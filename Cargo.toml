# Workspace configuration
[workspace]
members = [
    "crates/patina-runtime",
    "crates/patina-ir",
    "crates/patina-frontend",
    "crates/patina-macros",
    "crates/patina-pipeline",
    "crates/patina-tree-walker",
    "crates/patina-interpreter",
    "crates/patina-repl",
    "crates/patina-tests",
]
resolver = "2"

# Shared dependencies across workspace
[workspace.dependencies]
# Numeric tower support for R7RS compliance
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
num-complex = "0.4"

# Error handling
thiserror = "2.0"

# Thread-safe lazy statics
once_cell = "1.19"

# No main package anymore - workspace only
